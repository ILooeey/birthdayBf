<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nat's Birthday Quest 🎮</title>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- =========================
         CUSTOM CURSOR
    ========================== -->

    <div class="cursor"></div>


    <!-- =========================
         GAME DECORATION
    ========================== -->

    <div class="game-decoration decoration-1">
        ✦
    </div>

    <div class="game-decoration decoration-2">
        +
    </div>

    <div class="game-decoration decoration-3">
        ♡
    </div>

    <div class="game-decoration decoration-4">
        ✦
    </div>


    <!-- =========================
         GAME SCREEN
    ========================== -->

    <main class="game-screen">


        <!-- TOP BAR -->

        <div class="top-bar">

            <span>
                BIRTHDAY QUEST
            </span>

            <span>
                2026
            </span>

        </div>


        <!-- GAME CONTENT -->

        <section class="game-content">


            <!-- GAME LABEL -->

            <div class="game-label">

                <span class="pixel-dot"></span>

                NEW ADVENTURE UNLOCKED

            </div>


            <!-- TITLE -->

            <h1>

                NAT'S
                <span>BIRTHDAY</span>
                QUEST

            </h1>


            <!-- CHARACTER POLAROID -->

            <div class="character-card">

                <div class="tape"></div>

                <div class="character-photo">

                    <img
                        src="./d1.jpg"
                        alt="Nat"
                    >

                </div>

                <div class="character-info">

                    <span>
                        PLAYER
                    </span>

                    <strong>
                        NAT pacar jijahhh
                    </strong>

                </div>

            </div>


            <!-- DESCRIPTION -->

            <p class="game-description">

                A new adventure awaits...

            </p>

            <p class="game-subdescription">

                Complete the quests first to
                Unlock your birthday surprise, sayang <3

            </p>


            <!-- START BUTTON -->

            <button
                class="start-button"
                id="start-game"
            >

                <span class="button-icon">
                    ▶
                </span>

                START GAME

            </button>


            <!-- GAME INFO -->

            <div class="game-info">

                <div>
                    <span>PLAYER</span>
                    <strong>NAT</strong>
                </div>

                <div>
                    <span>LEVEL</span>
                    <strong>01</strong>
                </div>

                <div>
                    <span>STATUS</span>
                    <strong>READY</strong>
                </div>

            </div>


        </section>


        <!-- BOTTOM -->

        <div class="bottom-bar">

            <span>
                PRESS START TO BEGIN
            </span>

            <span>
                ♡ MADE FOR YOU
            </span>

        </div>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="./script.js"></script>

</body>

</html>
